services:
  pkl-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    container_name: pkl-local-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pkl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pkl-storage:
    image: public.ecr.aws/supabase/storage-api:v1.62.5
    container_name: pkl-local-storage
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${STORAGE_PORT}:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://supabase_storage_admin:${POSTGRES_PASSWORD}@pkl-db:5432/${POSTGRES_DB}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
    entrypoint:
      - /bin/sh
      - -c
      - |
        node -e '
        const fs = require("fs");
        try {
          let code = fs.readFileSync("/app/dist/app.js", "utf8");
          const target = "done(null);\n  });";
          if (!code.includes("Access-Control-Allow-Origin")) {
            const hook = `done(null);
          });
          app.addHook("onRequest", async (request, reply) => {
            const origin = request.headers.origin || "*";
            reply.header("Access-Control-Allow-Origin", origin);
            reply.header("Access-Control-Allow-Methods", "GET, HEAD, PUT, POST, DELETE, PATCH, OPTIONS");
            reply.header("Access-Control-Allow-Headers", "*");
            reply.header("Access-Control-Expose-Headers", "*");
            reply.header("Access-Control-Allow-Credentials", "true");
            if (request.method === "OPTIONS") {
              return reply.status(204).send();
            }
          });`;
            fs.writeFileSync("/app/dist/app.js", code.replace(target, hook));
            console.log("✅ [Storage] Injected CORS preflight & headers into Fastify app");
          }
        } catch (e) {
          console.error("⚠️ [Storage] Could not inject CORS:", e);
        }
        '
        exec node dist/start/server.js
    volumes:
      - pkl_storage_data:/var/lib/storage
    depends_on:
      pkl-db:
        condition: service_healthy

volumes:
  pkl_postgres_data:
  pkl_storage_data:
