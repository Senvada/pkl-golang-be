services:
  pkl-db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    container_name: pkl-local-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pkl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pkl-storage:
    image: public.ecr.aws/supabase/storage-api:v1.62.5
    container_name: pkl-local-storage
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${STORAGE_PORT}:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@pkl-db:5432/${POSTGRES_DB}
    volumes:
      - pkl_storage_data:/var/lib/storage
    depends_on:
      pkl-db:
        condition: service_healthy

volumes:
  pkl_postgres_data:
  pkl_storage_data:
